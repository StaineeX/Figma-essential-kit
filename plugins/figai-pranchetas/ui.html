<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:12px Inter,Arial,sans-serif;margin:16px;color:#222}h2{font-size:16px;margin:0 0 12px}label{display:block;margin:9px 0 4px}input,select{box-sizing:border-box;width:100%;height:30px;padding:5px;border:1px solid #bbb;border-radius:4px}button{height:32px;border:0;border-radius:5px;padding:0 14px;cursor:pointer}.row{display:flex;gap:8px}.row>*{flex:1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}#error{color:#c00;min-height:16px;margin-top:8px}
</style></head><body>
<h2>FIGAI Pranchetas</h2>
<label>Nome</label><input id="name" value="FIGAI Prancheta">
<div class="row"><div><label>Largura final</label><input id="width" type="number" value="21" min="0.01" step="0.01"></div><div><label>Altura</label><input id="height" type="number" value="29.7" min="0.01" step="0.01"></div></div>
<label>Unidade</label><select id="unit"><option value="cm">Centímetros</option><option value="m">Metros</option><option value="px">Pixels</option></select>
<label>Sangria em cada lado (mm) — somada à medida final</label><input id="bleedMm" type="number" value="5" min="0" step="0.5">
<label>Margem interna total (cm)</label><input id="marginCm" type="number" value="5" min="0" step="0.1">
<label>Dobras</label><select id="folds"><option value="0">Página inteira — 1 painel</option><option value="0">Meia página — 1 painel</option><option value="1">1 dobra — 2 painéis</option><option value="2">2 dobras — 3 painéis</option><option value="3">3 dobras — 4 painéis</option><option value="4">4 dobras — 5 painéis</option></select>
<div id="error"></div><div class="actions"><button id="cancel">Cancelar</button><button id="create" style="background:#18a058;color:white">Criar prancheta</button></div>
<script>
var $=function(id){return document.getElementById(id)};
$('cancel').onclick=function(){parent.postMessage({pluginMessage:{type:'cancel'}},'*')};
$('create').onclick=function(){
  $('error').textContent='';
  parent.postMessage({pluginMessage:{type:'create',data:{name:$('name').value,width:$('width').value,height:$('height').value,unit:$('unit').value,marginCm:$('marginCm').value,bleedMm:$('bleedMm').value,folds:$('folds').value}}},'*');
};
onmessage=function(event){if(event.data.pluginMessage&&event.data.pluginMessage.type==='error')$('error').textContent=event.data.pluginMessage.message};
</script></body></html>
